# XcodeGen spec: the .xcodeproj is generated (`xcodegen generate`) and not committed,
# which removes project-file merge conflicts. Edit this file, not the project.
name: PawMatch
options:
  bundleIdPrefix: com.pawmatch
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PawMatchKit:
    path: Packages/PawMatchKit

targets:
  PawMatch:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: PawMatchKit
        product: Domain
      - package: PawMatchKit
        product: DataAccess
      - package: PawMatchKit
        product: Fixtures
      - package: PawMatchKit
        product: FeatureDiscover
      - package: PawMatchKit
        product: FeatureMatches
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PawMatch
        # Languages the app declares to iOS / the App Store. Keep in sync with the String Catalogs.
        CFBundleLocalizations: [en, fr, es]
        NSLocationWhenInUseUsageDescription: Your location is used to show animals from shelters near you.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawmatch.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

schemes:
  PawMatch:
    build:
      targets:
        PawMatch: all
    run:
      config: Debug
    test:
      config: Debug
