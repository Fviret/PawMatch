name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A new push on the same branch cancels the run in progress (saves macOS minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localizations:
    name: Localizations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check String Catalogs
        run: python3 scripts/check_localizations.py

  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      # Full logs go to files (uploaded on failure); the console shows the essentials.
      - name: Build app
        run: |
          mkdir -p build
          xcodebuild build \
            -project PawMatch.xcodeproj \
            -scheme PawMatch \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/app-build.log 2>&1 \
            || { grep -E "error:" build/app-build.log | sort -u; tail -40 build/app-build.log; exit 1; }
          grep -E "warning:" build/app-build.log | sort -u || true
          tail -1 build/app-build.log

      - name: Run unit tests
        working-directory: Packages/PawMatchKit
        run: |
          xcodebuild test \
            -scheme PawMatchKit-Package \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath ../../build/PackageDerivedData \
            -resultBundlePath ../../build/TestResults.xcresult \
            > ../../build/test.log 2>&1 \
            || { grep -E "error:|✘" ../../build/test.log | sort -u; tail -40 ../../build/test.log; exit 1; }
          grep -E "✔ Test run|✘" ../../build/test.log | sort -u

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/*.log
            build/TestResults.xcresult
          retention-days: 7
